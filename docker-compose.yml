services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "127.0.0.1:3210:3000"
    environment:
      DATA_DIR: /data
      # se leen del fichero .env (ver .env.example)
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - ./data:/data

volumes:
  node_modules:
